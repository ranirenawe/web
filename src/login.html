<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <a href="/index.html" class="inline-block mb-4 text-blue-500 hover:underline">← Back</a>
    <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>

    <form id="loginForm" action="/src/login" method="post" class="space-y-4">
      <div>
        <label for="userInput" class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
        <input id="userInput" type="text" placeholder="Username or Email" required autocomplete="username"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="passInput" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input id="passInput" type="password" placeholder="Password" required autocomplete="current-password"
                 class="w-full border border-gray-300 rounded px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button" onclick="togglePassword('passInput', this)"
                  class="absolute inset-y-0 right-0 px-3 text-gray-500 hover:text-gray-700">👁</button>
        </div>
      </div>

      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Login
      </button>
    </form>
    <div id="loginMessage" class="mt-2 text-red-500 text-center text-sm"></div>

    <a href="#" class="block text-right mt-4 text-blue-500 hover:underline"
       onclick="alert('Forgot password functionality to be implemented.');">Forgot Password?</a>
    <a href="/src/register.html" class="block text-center mt-2 text-blue-500 hover:underline">
      Don't have an account? Register
    </a>
  </div>

  <script src="login.js"></script>
</body>
</html>
